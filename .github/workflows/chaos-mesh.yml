name: chaos mesh

on:
  pull_request:
    paths:
      - deploy/chaos-mesh/**
      - .github/workflows/chaos-mesh.yml
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to install or upgrade Chaos Mesh in production
        required: true
        type: string

permissions:
  contents: read

# Share the app deployment lock: never modify the cluster concurrently.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Helm
        run: |
          curl -fsSLo /tmp/helm.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          echo 'ee88b3c851ae6466a3de507f7be73fe94d54cbf2987cbaa3d1a3832ea331f2cd  /tmp/helm.tar.gz' | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Verify and render vendored chart
        run: |
          cd deploy/chaos-mesh
          sha256sum -c SHA256SUMS
          helm lint chaos-mesh-2.8.4.tgz -f values.yaml --strict
          helm template chaos-mesh chaos-mesh-2.8.4.tgz -n chaos-mesh -f values.yaml --include-crds > /tmp/chaos-mesh.yaml

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require main and confirmation
        env:
          REF: ${{ github.ref }}
          CONFIRM: ${{ inputs.confirm }}
        run: test "$REF" = refs/heads/main && test "$CONFIRM" = deploy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Helm
        run: |
          curl -fsSLo /tmp/helm.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          echo 'ee88b3c851ae6466a3de507f7be73fe94d54cbf2987cbaa3d1a3832ea331f2cd  /tmp/helm.tar.gz' | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.5
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: browserjs
          location: us-west1-a
          project_id: ${{ vars.GCP_PROJECT_ID }}
          use_dns_based_endpoint: "true"
      - name: Apply reviewed configuration
        run: |
          set -euo pipefail
          test '${{ vars.GCP_PROJECT_ID }}' = browserjs-sessions
          cd deploy/chaos-mesh
          sha256sum -c SHA256SUMS
          # Helm does not upgrade CRDs. Extract the pinned chart for explicit upgrades.
          tar -xzf chaos-mesh-2.8.4.tgz -C /tmp
          kubectl apply --server-side -f /tmp/chaos-mesh/crds/
          helm upgrade --install chaos-mesh ./chaos-mesh-2.8.4.tgz \
            --namespace chaos-mesh --create-namespace --skip-crds \
            --values values.yaml --atomic --wait --timeout 10m --history-max 10
          kubectl get deployments,daemonsets,pods,services,pvc -n chaos-mesh
