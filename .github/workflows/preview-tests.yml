name: preview tests

on:
  pull_request:
    paths:
      - "hack/preview*.py"
      - "test/preview/**"
      - "deploy/**"
      - ".github/workflows/preview*.yml"
      - "docs/contracts/policy/**"
  push:
    branches: [main]
    paths:
      - "hack/preview*.py"
      - "test/preview/**"
      - "deploy/**"
      - ".github/workflows/preview*.yml"
      - "docs/contracts/policy/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 -m unittest discover -s test/preview -v
      - name: Lint preview and production deployment workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= .github/workflows/preview-build.yml .github/workflows/preview-deploy.yml .github/workflows/preview-cleanup.yml .github/workflows/preview-tests.yml .github/workflows/deploy.yml
