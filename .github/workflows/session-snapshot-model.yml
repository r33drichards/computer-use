name: session snapshot model

on:
  pull_request:
    paths:
      - 'spec/session-snapshot/**'
      - '.github/workflows/session-snapshot-model.yml'
  push:
    branches: [main]
    paths:
      - 'spec/session-snapshot/**'
      - '.github/workflows/session-snapshot-model.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: session-snapshot-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Check counterexamples and safe configurations
        run: spec/session-snapshot/check.sh
      - name: Verify checked-in traces
        run: git diff --exit-code -- spec/session-snapshot/traces
