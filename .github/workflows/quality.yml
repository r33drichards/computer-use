name: quality

# The checks that are not one component's tests: lint, fuzzing, valgrind and
# TLA+ model checking, over the whole repository. The per-component workflows
# (backend-tests, web-tests, sdk, ...) run the formatters and test suites.
# What each check covers, and what is still missing, is in docs/ci-notes.md.
#
# Runs on every pull request and every push to main, whatever the paths, so
# that a new component is covered the day it is added (hack/ci-coverage.sh
# fails when one is not). A nightly run fuzzes for longer. The `report` job
# keeps one comment on the pull request with every result.
#
# Everything fans out: no job waits on another except `report`, lint is one
# job per tool, and fuzz targets and TLA+ configurations are matrix legs found
# by a `discover` job, so a new target or spec adds a parallel leg, not time.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  TLA2TOOLS_VERSION: v1.8.0
  TLA2TOOLS_SHA256: 7beec0f04818732a62fa193731711a99aa4f11279499b2360a7d156c519ea78d

jobs:
  # The gating scripts' own tests (test/ci).
  scripts:
    name: lint (script tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s test/ci -v

  # Finds what the fuzz and TLA+ matrices fan out over.
  discover:
    name: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      fuzz: ${{ steps.find.outputs.fuzz }}
      tla: ${{ steps.find.outputs.tla }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          # Each target with its package directory and the Go module (the
          # nearest go.mod above it) whose toolchain builds it.
          fuzz=$(grep -rHE '^func Fuzz[A-Za-z0-9_]*\(' --include='*_test.go' . \
            | sed -E 's|^\./([^:]*)/[^/:]*:func (Fuzz[A-Za-z0-9_]*)\(.*|\1 \2|' \
            | while read -r pkg target; do
                mod=$pkg
                while [ ! -f "$mod/go.mod" ] && [ "$mod" != . ]; do mod=$(dirname "$mod"); done
                echo "$pkg $target $mod"
              done \
            | jq -R -s -c 'split("\n") | map(select(length>0) | split(" ") | {pkg: .[0], target: .[1], module: .[2]})')
          tla=$(for cfg in spec/*/*.cfg; do echo "$cfg"; done \
            | jq -R -s -c 'split("\n") | map(select(length>0) | {cfg: .})')
          echo "fuzz=$fuzz" >> "$GITHUB_OUTPUT"
          echo "tla=$tla" >> "$GITHUB_OUTPUT"

  coverage:
    name: lint (component coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: hack/ci-coverage.sh

  actionlint:
    name: lint (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=

  shellcheck:
    name: lint (shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          git ls-files '*.sh' ':!:*/examples/*' \
            | xargs shellcheck -S warning -x -e SC2148,SC2034

  ruff:
    name: lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Syntax errors, undefined names, unused imports.
      - run: |
          python3 -m pip install ruff==0.15.20
          ruff check --select E9,F --exclude 'test/webhooks-nixos/*-test.py' .

  staticcheck:
    name: lint (staticcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - working-directory: backend
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 \
            -checks 'all,-ST1000,-ST1003,-ST1005,-ST1016,-ST1020,-ST1021,-ST1022' ./...

  # One leg per `func FuzzXxx`, all at once: 30 s each on a pull request,
  # 10 minutes overnight. A new target is a new leg with no edit here. A
  # failing input is written to testdata/fuzz/; commit it as a seed.
  fuzz:
    name: fuzz ${{ matrix.target }}
    needs: discover
    if: needs.discover.outputs.fuzz != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.fuzz) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Fuzz
        env:
          FUZZTIME: ${{ github.event_name == 'schedule' && '10m' || '30s' }}
          TARGET: ${{ matrix.target }}
          PKG: ${{ matrix.pkg }}
        run: |
          cd "$PKG"
          go test . -run '^$' -fuzz "^${TARGET}\$" -fuzztime "$FUZZTIME"

      - name: Keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: ${{ matrix.pkg }}/testdata/fuzz/**
          if-no-files-found: ignore

  # The SDK is the repo's native code: a Rust library with a C ABI that the Go
  # provider links and the Python and JavaScript packages load. Its tests run
  # under memcheck; an invalid access or a definite leak fails the job.
  valgrind:
    name: valgrind (sdk tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdk/target
          key: sdk-valgrind-${{ hashFiles('sdk/Cargo.lock', 'flake.lock') }}
          restore-keys: |
            sdk-valgrind-

      - name: Install valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind

      - name: Tests under valgrind
        env:
          CARGO_PROFILE_DEV_DEBUG: "1"
          CARGO_INCREMENTAL: "0"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=definite
        run: nix develop ..#sdk -c cargo test --workspace --tests --locked

  # One leg per TLC configuration (spec/<name>/<config>.cfg), all at once.
  # A configuration listed in its spec's `expect-violation` file must find a
  # violation; every other must hold (see hack/tlc-check.sh). Specs:
  # spec/opa-replacement/.
  tla:
    name: tla+ ${{ matrix.cfg }}
    needs: discover
    if: needs.discover.outputs.tla != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.tla) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: TLC
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA2TOOLS_VERSION}/tla2tools.jar"
          echo "${TLA2TOOLS_SHA256}  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
          echo "TLA2TOOLS=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Check the configuration
        env:
          CFG: ${{ matrix.cfg }}
        run: hack/tlc-check.sh "$CFG"

  report:
    name: report
    if: github.event_name == 'pull_request' && always()
    needs: [coverage, scripts, actionlint, shellcheck, ruff, staticcheck, fuzz, valgrind, tla]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # One comment, only when something fails, edited in place on every push. A pull request from a
      # fork has a read-only token and cannot comment; the results are then
      # in the run's summary only.
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LINT: ${{ needs.coverage.result == 'success' && needs.scripts.result == 'success' && needs.actionlint.result == 'success' && needs.shellcheck.result == 'success' && needs.ruff.result == 'success' && needs.staticcheck.result == 'success' && 'success' || 'failure' }}
          FUZZ: ${{ needs.fuzz.result }}
          VALGRIND: ${{ needs.valgrind.result }}
          TLA: ${{ needs.tla.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          icon() { case "$1" in success) echo "✅ passed";; skipped) echo "⏭️ skipped";; cancelled) echo "⚪ cancelled";; *) echo "❌ $1";; esac; }
          {
            echo "<!-- quality-report -->"
            echo "### Quality checks"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Lint (actionlint, shellcheck, ruff, staticcheck, component coverage) | $(icon "$LINT") |"
            echo "| Fuzzing (every Go \`Fuzz\` target, 30 s each) | $(icon "$FUZZ") |"
            echo "| Valgrind (SDK tests) | $(icon "$VALGRIND") |"
            echo "| TLA+ (TLC over \`spec/\`) | $(icon "$TLA") |"
            echo
            echo "[Run details]($RUN_URL) · what each check covers: \`docs/ci-notes.md\`"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- quality-report -->"))][0].id // empty') || existing=""
          # All green: nothing to say. A comment left from an earlier failing
          # push is removed rather than left to say the opposite.
          if [ "$LINT$FUZZ$VALGRIND$TLA" = successsuccesssuccesssuccess ]; then
            if [ -n "$existing" ]; then
              gh api --method DELETE "repos/$GH_REPO/issues/comments/$existing" >/dev/null \
                || echo "::warning::could not delete the old comment (read-only token?)"
            fi
            exit 0
          fi
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$existing" -F body=@comment.md >/dev/null \
              || echo "::warning::could not update the comment (read-only token?)"
          else
            gh pr comment "$PR" --body-file comment.md \
              || echo "::warning::could not comment (read-only token?)"
          fi
