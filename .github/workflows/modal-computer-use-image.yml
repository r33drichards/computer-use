name: Modal Computer Use image

on:
  pull_request:
    paths:
      - deploy/modal-computer-use/**
      - .github/workflows/modal-computer-use-image.yml
  push:
    branches: [main, codex/modal-computer-use]
    paths:
      - deploy/modal-computer-use/**
      - .github/workflows/modal-computer-use-image.yml

permissions:
  contents: read

jobs:
  verify:
    name: Build and smoke-test OCI image (read-only)
    if: >-
      github.event_name == 'pull_request' &&
      !(github.event.pull_request.head.repo.full_name == 'r33drichards/computer-use' &&
        github.event.pull_request.head.ref == 'codex/modal-computer-use')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space on the hosted runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: bash deploy/modal-computer-use/ci-build.sh computer-use-modal-ci:pr

  publish:
    name: Build, smoke-test and publish OCI image
    if: >-
      github.event_name == 'push' &&
      github.repository == 'r33drichards/computer-use' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/modal-computer-use')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space on the hosted runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: bash deploy/modal-computer-use/ci-build.sh computer-use-modal-ci:release
      - name: Publish the exact tested local image
        env:
          GHCR_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/computer-use-modal-registry
          BUILDX_CONFIG: ${{ runner.temp }}/computer-use-modal-registry/buildx
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          bash deploy/modal-computer-use/ci-publish.sh computer-use-modal-ci:release
