# Weekly dependency updates, grouped so each ecosystem is one PR.
# Keep in step with docs/ci-notes.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /sdk/go
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /terraform-provider-computeruse
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /terraform-provider-metronome
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /sdk
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /sdk/js
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /images/billing-operator
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /images/browser
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /images/mcp-js
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /images/policy-operator
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
