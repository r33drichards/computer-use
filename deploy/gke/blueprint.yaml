# deploy/base/blueprint.yaml for GKE: gVisor nodes, the session
# ServiceAccount, the images from the registry, and what Agent Sandbox's
# admission policies ask for. Keep the rest in step with base.
#
# The two image lines are written by hack/pin-images.sh from the images:
# block of kustomization.yaml; do not edit them here.
#
# The spec of a session's Sandbox (agents.x-k8s.io/v1beta1), rendered by the
# backend for each new session: {{ .ID }} is the session's ID, {{ .SessionURL }}
# its own base URL (https://<sessions host>/<id>), {{ .PublicURL }} the app's. The backend adds operatingMode
# and the owner label.
podTemplate:
  metadata:
    annotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    labels:
      app: browserjs-session
  spec:
    # The managed add-on's sandbox-core-policy requires gVisor; the label and
    # taint are what GKE puts on the sessions node pool.
    # Prefer packing beside existing sessions, but allow a new node.
    affinity:
      podAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels: {app: browserjs-session}
              topologyKey: kubernetes.io/hostname
    runtimeClassName: gvisor
    nodeSelector:
      sandbox.gke.io/runtime: gvisor
    tolerations:
      - key: sandbox.gke.io/runtime
        operator: Equal
        value: gvisor
        effect: NoSchedule
    serviceAccountName: session
    automountServiceAccountToken: false
    enableServiceLinks: false
    # Chromium only saves its tabs on a clean exit: the browser's entrypoint
    # asks it to quit and waits up to 10 s before stopping the rest.
    terminationGracePeriodSeconds: 30
    securityContext:
      # mcp-js runs as uid/gid 1000 and writes to the session disk.
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      # Nothing in a session runs as root: sandbox-hardening-policy requires
      # it. uid 1000 is "browser" in the browser image and "mcpuser" in
      # mcp-js; the session disk is group-writable for gid 1000 (fsGroup).
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      # No seccompProfile: GKE Sandbox does not support seccomp (gVisor is
      # the system call filter), and the policies do not ask for one.
    containers:
      - name: browser
        image: us-west1-docker.pkg.dev/browserjs-sessions/browserjs/browser@sha256:58b11812b7651f2b3af7a754feda7a3eca05d21db81af73916b47d037faad3de
        env:
          - name: SESSION_MODE
            value: "1"
          - name: DATA_DIR
            value: /data
          - name: TAB_STATE_FILE
            value: /data/chrome/browserjs-tabs.json
        ports:
          - name: vnc
            containerPort: 6080
          - name: browser-mcp
            containerPort: 8081
        # Both probes are HTTP: the server is what must answer.
        startupProbe:
          httpGet:
            path: /healthz
            port: browser-mcp
          periodSeconds: 1
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /healthz
            port: browser-mcp
          periodSeconds: 5
          # Sessions share CPU (see resources); a slow answer under load is
          # not a dead browser. Not ready only after 30s without an answer.
          timeoutSeconds: 5
          failureThreshold: 6
        # Three small sessions share one 4-vCPU/16-GB node. Each requests
        # 1 CPU and 2.5 GiB across both containers, with a 3 GiB memory limit.
        resources:
          requests:
            cpu: 850m
            memory: 2Gi
          limits:
            cpu: 1500m
            memory: 2Gi
        # No capabilities and no way to gain any. Chromium runs with
        # --no-sandbox; gVisor is the sandbox.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: data
            mountPath: /data/chrome
            subPath: chrome
          - name: shm
            mountPath: /dev/shm
      - name: mcp-js
        image: us-west1-docker.pkg.dev/browserjs-sessions/browserjs/mcp-js@sha256:e3e1e5501814d36c33a02c66bac9ed3b0c0c799e9c3597b144b854621f69a1a6
        env:
          # One-time upload URLs are made from this (mcp-js appends
          # /api/artifact-uploads/<token>), so they come back under the
          # session's own prefix.
          - name: MCP_V8_PUBLIC_URL
            value: "{{ .SessionURL }}"
          # Native pre hook records attempts; existing policies authorize every call.
          # Session policy: every tool call and fetch request is also put to the shared OPA, at
          # this session's own path. Written by hack/policy-stage.sh.
          - name: MCP_V8_POLICIES_JSON
            value: >-
              {"mcp_tools":{"pre":[
              {"url":"http://policy-operator.browserjs-sessions.svc:8080","policy_path":"browserjs/hooks/{{ .ID }}/mcp_tools/pre"}],
              "mode":"all","policies":[
              {"url":"file:///etc/mcp/mcp_tools.rego"},
              {"url":"http://opa.browserjs-sessions.svc:8181","policy_path":"browserjs/decision/{{ .ID }}/mcp_tools"}]},
              "filesystem":{"policies":[{"url":"file:///etc/mcp/filesystem.rego"}]},"fetch":{"mode":"all","policies":[{"url":"file:///etc/mcp/fetch.rego"},{"url":"http://opa.browserjs-sessions.svc:8181","policy_path":"browserjs/decision/{{ .ID }}/mcp_tools"}]}}
        ports:
          - name: mcp
            containerPort: 8080
        startupProbe:
          httpGet:
            path: /api/artifacts
            port: mcp
          periodSeconds: 1
          failureThreshold: 180
        readinessProbe:
          httpGet:
            path: /api/artifacts
            port: mcp
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            cpu: 150m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: data
            mountPath: /data
    volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: browserjs-session-hdd
      resources:
        requests:
          storage: 32Gi
