# The sizes a session can have besides "small". Small is blueprint.yaml as it
# is written (and the SandboxTemplate of warmpool.yaml, which is the same):
# 1.5 CPU and 2 GiB limit for the desktop (850m and 2 GiB requested). A size here is that same pod with other
# numbers, and can say nothing else: each container's requests and limits,
# the size of /dev/shm, and environment variables that go with the size. The
# backend (internal/sessions/sizes.go) puts them into the blueprint when a
# session of that size is made or resized to it; deploy_test.go there holds
# this file to the node it has to fit on and to the billing catalogue.
#
# Only small is kept warm. Medium and large start cold after idle warm
# spares yield the resources they need (docs/session-sizes.md has the
# times).
#
# The numbers are sized for a session node of 4 vCPU and 16 GB, which has
# 3213m of CPU and 12097Mi left for sessions (capacity, below).
sizes:
  - name: medium
    containers:
      browser:
        resources:
          requests: {cpu: 1350m, memory: 5Gi}
          limits: {cpu: "2", memory: 5Gi}
      mcp-js:
        resources:
          requests: {cpu: 150m, memory: 512Mi}
          limits: {cpu: 500m, memory: 1Gi}
        env: {MCP_V8_HEAP_MEMORY_MAX: "16"}
    shm: 2Gi
  - name: large
    containers:
      browser:
        resources:
          requests: {cpu: 2850m, memory: 10Gi}
          limits: {cpu: "3", memory: 10Gi}
      mcp-js:
        resources:
          requests: {cpu: 150m, memory: 1Gi}
          limits: {cpu: 500m, memory: 1Gi}
        env: {MCP_V8_HEAP_MEMORY_MAX: "32"}
    shm: 4Gi

# One production session node in us-west1-c. Conservative room after node
# services: three small sessions (1 CPU/2.5 GiB requested each) fit.
capacity:
  nodes: 1
  cpu: 3213m
  memory: 12097Mi
