# Contains only account identity and authenticated ciphertext. GitHub access
# and refresh tokens are encrypted by the backend's independent encryption key.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: githubconnections.browserjs.dev
spec:
  group: browserjs.dev
  scope: Namespaced
  names:
    plural: githubconnections
    singular: githubconnection
    kind: GitHubConnection
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [owner, encrypted]
              properties:
                owner:
                  type: string
                  minLength: 1
                encrypted:
                  type: string
                  minLength: 1
                lockUntil:
                  type: string
