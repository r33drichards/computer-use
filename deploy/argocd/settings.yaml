apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  admin.enabled: 'true'
  timeout.reconciliation: 60s
  resource.customizations.health.argoproj.io_Rollout: "function checkReplicasStatus(obj)\n\
    \  local hs = {}\n  local desiredReplicas = getNumberValueOrDefault(obj.spec.replicas,\
    \ 1)\n  statusReplicas = getNumberValueOrDefault(obj.status.replicas, 0)\n  updatedReplicas\
    \ = getNumberValueOrDefault(obj.status.updatedReplicas, 0)\n  local availableReplicas\
    \ = getNumberValueOrDefault(obj.status.availableReplicas, 0)\n  \n  if updatedReplicas\
    \ < desiredReplicas then\n    hs.status = \"Progressing\"\n    hs.message = \"\
    Waiting for roll out to finish: More replicas need to be updated\"\n    return\
    \ hs\n  end\n  if availableReplicas < updatedReplicas then\n    hs.status = \"\
    Progressing\"\n    hs.message = \"Waiting for roll out to finish: updated replicas\
    \ are still becoming available\"\n    return hs\n  end\n  return nil\nend\n\n\
    -- In Argo Rollouts v0.8 we deprecated .status.canary.stableRS for .status.stableRS\n\
    -- This func grabs the correct one.\nfunction getStableRS(obj)\n  if obj.status.stableRS\
    \ ~= nil then\n    return obj.status.stableRS\n  end\n  if obj.status.canary ~=\
    \ nil then\n      return obj.status.canary.stableRS\n  end\n  return \"\"\nend\n\
    \nfunction getNumberValueOrDefault(field, default)\n  if field ~= nil then\n \
    \   return field\n  end\n  return default\nend\n\nfunction checkPaused(obj)\n\
    \  local hs = {}\n  hs.status = \"Suspended\"\n  hs.message = \"Rollout is paused\"\
    \n  if obj.status.pauseConditions ~= nil and table.getn(obj.status.pauseConditions)\
    \ > 0 then\n    return hs\n  end\n\n  if obj.spec.paused ~= nil and obj.spec.paused\
    \ then\n    return hs\n  end\n  return nil\nend\n\n-- isGenerationObserved determines\
    \ if the rollout spec has been observed by the controller. This\n-- only applies\
    \ to v0.10 rollout which uses a numeric status.observedGeneration. For v0.9 rollouts\n\
    -- and below this function always returns true.\nfunction isGenerationObserved(obj)\n\
    \  if obj.status == nil then\n    return false\n  end\n  observedGeneration =\
    \ tonumber(obj.status.observedGeneration)\n  if observedGeneration == nil or observedGeneration\
    \ > obj.metadata.generation then\n    -- if we get here, the rollout is a v0.9\
    \ rollout\n    return true\n  end\n  return observedGeneration == obj.metadata.generation\n\
    end\n\n-- isWorkloadGenerationObserved determines if the referenced workload's\
    \ generation spec has been\n-- observed by the controller. This only applies to\
    \ v1.1 rollout\nfunction isWorkloadGenerationObserved(obj)\n  if obj.spec.workloadRef\
    \ == nil or obj.metadata.annotations == nil then\n    -- rollout is v1.0 or earlier\n\
    \    return true\n  end\n  local workloadGen = tonumber(obj.metadata.annotations[\"\
    rollout.argoproj.io/workload-generation\"])\n  local observedWorkloadGen = tonumber(obj.status.workloadObservedGeneration)\n\
    \  return workloadGen == observedWorkloadGen\nend\n\nlocal hs = {}\nif not isGenerationObserved(obj)\
    \ or not isWorkloadGenerationObserved(obj) then\n  hs.status = \"Progressing\"\
    \n  hs.message = \"Waiting for rollout spec update to be observed\"\n  return\
    \ hs\nend\n\n-- Argo Rollouts v1.0 has been improved to record a phase/message\
    \ in status, which Argo CD can blindly surface\nif obj.status.phase ~= nil then\n\
    \  if obj.status.phase == \"Paused\" then\n    -- Map Rollout's \"Paused\" status\
    \ to Argo CD's \"Suspended\"\n    hs.status = \"Suspended\"\n  else \n    hs.status\
    \ = obj.status.phase\n  end\n  hs.message = obj.status.message\n  return hs\n\
    end\n\nfor _, condition in ipairs(obj.status.conditions) do\n  if condition.type\
    \ == \"InvalidSpec\" then\n    hs.status = \"Degraded\"\n    hs.message = condition.message\n\
    \    return hs\n  end\n  if condition.type == \"Progressing\" and condition.reason\
    \ == \"RolloutAborted\" then\n    hs.status = \"Degraded\"\n    hs.message = condition.message\n\
    \    return hs\n  end\n  if condition.type == \"Progressing\" and condition.reason\
    \ == \"ProgressDeadlineExceeded\" then\n    hs.status = \"Degraded\"\n    hs.message\
    \ = condition.message\n    return hs\n  end\nend\n\nlocal isPaused = checkPaused(obj)\n\
    if isPaused ~= nil then\n  return isPaused\nend\n\nif obj.status.currentPodHash\
    \ == nil then\n  hs.status = \"Progressing\"\n  hs.message = \"Waiting for rollout\
    \ to finish: status has not been reconciled.\"\n  return hs\nend\n\nreplicasHS\
    \ = checkReplicasStatus(obj)\nif replicasHS ~= nil then\n  return replicasHS\n\
    end\n\n\nlocal stableRS = getStableRS(obj)\n\nif obj.spec.strategy.blueGreen ~=\
    \ nil then\n  if obj.status.blueGreen == nil or obj.status.blueGreen.activeSelector\
    \ ~= obj.status.currentPodHash then\n    hs.status = \"Progressing\"\n    hs.message\
    \ = \"active service cutover pending\"\n    return hs\n  end\n  -- Starting in\
    \ v0.8 blue-green uses status.stableRS. To drop support for v0.7, uncomment following\n\
    \  -- if stableRS == \"\" or stableRS ~= obj.status.currentPodHash then\n  if\
    \ stableRS ~= \"\" and stableRS ~= obj.status.currentPodHash then\n    hs.status\
    \ = \"Progressing\"\n    hs.message = \"waiting for analysis to complete\"\n \
    \   return hs\n  end\nelseif obj.spec.strategy.canary ~= nil then\n  if statusReplicas\
    \ > updatedReplicas then\n    hs.status = \"Progressing\"\n    hs.message = \"\
    Waiting for roll out to finish: old replicas are pending termination\"\n    return\
    \ hs\n  end\n  if stableRS == \"\" or stableRS ~= obj.status.currentPodHash then\n\
    \    hs.status = \"Progressing\"\n    hs.message = \"Waiting for rollout to finish\
    \ steps\"\n    return hs\n  end\nend\n\nhs.status = \"Healthy\"\nhs.message =\
    \ \"\"\nreturn hs"
