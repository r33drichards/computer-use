name: provider release candidate (local approval boundary)
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.26.8'
          cache: false
      - name: Matching declared Rust toolchain
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0
      - name: Native build, vet, tests and runtime dependency inspection
        env:
          VERSION: ${{ inputs.version }}
        run: bash release/validate-version.sh "$VERSION" && bash release/build-platform.sh "$VERSION" '${{ matrix.os }}' '${{ matrix.arch }}'
      - name: Preserve executable modes for artifact transport
        run: tar -czf native-${{ matrix.os }}_${{ matrix.arch }}.tar.gz -C dist/binaries ${{ matrix.os }}_${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.os }}_${{ matrix.arch }}
          path: native-*.tar.gz
          if-no-files-found: error
  package:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          merge-multiple: true
          path: dist/native
      - name: Four ZIPs, protocol-6 manifest and checksums including manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash release/validate-version.sh "$VERSION"
          mkdir -p dist/binaries
          for archive in dist/native/*.tar.gz; do tar -xzf "$archive" -C dist/binaries; done
          python3 release/package_test.py -v
          python3 release/package.py "$VERSION" dist/binaries dist/release
          (cd dist/release && sha256sum -c "terraform-provider-computeruse_${VERSION}_SHA256SUMS")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-provider-candidate
          path: dist/release/*
          if-no-files-found: error
  # No publishing, tagging, release creation or secret/signing step here.
  # Parent must run release/check-install.sh natively on each platform and then
  # release/sign-checksums.sh with its authorized existing GPG identity.
