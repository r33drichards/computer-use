apiVersion: v1
data:
  config.yaml: "# Dex for production. It federates the sign-in: Pomerium is its one\
    \ client,\n# Google and GitHub its connectors, and there are no passwords of its\
    \ own.\n# Both OAuth apps must list https://dex.computeruse.site/dex/callback.\
    \ $NAMES\n# are read from the environment (the dex-oauth Secret).\nissuer: https://dex.computeruse.site/dex\n\
    \nstorage:\n  type: kubernetes\n  config:\n    inCluster: true\n\nweb:\n  http:\
    \ 0.0.0.0:5556\n\n# Health checks (and metrics), away from the public port.\n\
    telemetry:\n  http: 0.0.0.0:5558\n\noauth2:\n  responseTypes: [\"code\"]\n  skipApprovalScreen:\
    \ true\n\n# No local users: the only ways in are the two connectors.\nenablePasswordDB:\
    \ false\n\nstaticClients:\n  - id: pomerium\n    name: Computer Use sessions\n\
    \    secretEnv: POMERIUM_CLIENT_SECRET\n    redirectURIs:\n      - https://authenticate.computeruse.site/oauth2/callback\n\
    \nconnectors:\n  - type: google\n    id: google\n    name: Google\n    config:\n\
    \      clientID: $GOOGLE_CLIENT_ID\n      clientSecret: $GOOGLE_CLIENT_SECRET\n\
    \      redirectURI: https://dex.computeruse.site/dex/callback\n  - type: github\n\
    \    id: github\n    name: GitHub\n    config:\n      clientID: $GITHUB_CLIENT_ID\n\
    \      clientSecret: $GITHUB_CLIENT_SECRET\n      redirectURI: https://dex.computeruse.site/dex/callback\n"
kind: ConfigMap
metadata:
