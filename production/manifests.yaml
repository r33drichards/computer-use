apiVersion: v1
kind: ConfigMap
metadata:
  name: release-canary
  namespace: browserjs-sessions
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
data:
  canary.py: "#!/usr/bin/env python3\n\"\"\"The release canary: one session, end to\
    \ end, through the public API host\nwith an API token. What a release must not\
    \ break (docs/releases.md).\n\n  CANARY_API_TOKEN=bjs_... test/canary.py\n\nPython's\
    \ standard library only. It prints one line a check and exits 0 only\nif every\
    \ check passed. The session it makes is deleted whatever happens, and\nso is one\
    \ a run before it left behind. Nothing it prints is secret: no token,\nno email\
    \ address.\n\nThe environment:\n\n  CANARY_API_TOKEN     required. An API token\
    \ with the scopes sessions:read,\n                       sessions:write, sessions:connect,\
    \ policies:read and\n                       policies:write (the app's API tokens\
    \ page). Never\n                       printed.\n  DOMAIN               computeruse.site.\
    \ The API is https://api.<DOMAIN>, the\n                       app https://app.<DOMAIN>,\
    \ the site https://<DOMAIN>.\n  API_URL, APP_URL,    each of those, to say otherwise.\
    \ APP_URL or SITE_URL\n  SITE_URL             empty: that check is left out.\n\
    \  API_HOST             the Host header sent to API_URL, when API_URL is not\n\
    \                       the public name: a backend asked directly, inside the\n\
    \                       cluster (the rollout's check of a standby backend)\n \
    \ CA_FILE              a CA certificate to trust (a local cluster's)\n  CANARY_DIGESTS\
    \       \"browser=sha256:...,mcp-js=sha256:...\": the session is\n           \
    \            a canary session, started cold on those digests of the\n        \
    \               session images (the token's owner must be an admin of\n      \
    \                 the deployment). Unset: an ordinary session, from the\n    \
    \                   warm pool if there is one.\n  EXPECT_STATE_SAVED   1 (default):\
    \ sleep must save the session's state and\n                       wake must bring\
    \ it back as it was (Pod Snapshots).\n                       0: a cluster without\
    \ snapshots; wake starts it fresh.\n  EXPECT_SNAPSHOT_DISK_CONSISTENCY  1 (default):\
    \ churn Chromium localStorage\n                       across two snapshot sleep/wake\
    \ cycles. Set to 0 for\n                       baseline/rollback checks of releases\
    \ predating the fix.\n                       Only used when EXPECT_STATE_SAVED=1.\n\
    \  EXPECT_POLICIES      1 (default): the session's policy is changed and must\n\
    \                       bind. 0: a deployment with session policies off.\n  EXPECT_MCP_CAPABILITIES\
    \  1 (default): verify skills, PNG imports, fetch and editable fetch\n       \
    \                permissions. 0: baseline/rollback checks of old releases.\n \
    \ FETCH_URL            URL to fetch (example.com, or localhost in kind).\n  SESSION_HOOK\
    \         a command run once the session is running, with\n                  \
    \     SESSION_ID in its environment (the release workflow\n                  \
    \     checks the pod's images with it). Its failure fails\n                  \
