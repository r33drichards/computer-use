kind: ConfigMap
metadata:
  name: pomerium-config-m7g8chg6h5
  namespace: browserjs-sessions
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
---
apiVersion: v1
data:
  blueprint.yaml: "# deploy/base/blueprint.yaml for GKE: gVisor nodes, the session\n\
    # ServiceAccount, the images from the registry, and what Agent Sandbox's\n# admission\
    \ policies ask for. Keep the rest in step with base.\n#\n# The two image lines\
    \ are written by hack/pin-images.sh from the images:\n# block of kustomization.yaml;\
    \ do not edit them here.\n#\n# The spec of a session's Sandbox (agents.x-k8s.io/v1beta1),\
    \ rendered by the\n# backend for each new session: {{ .ID }} is the session's\
    \ ID, {{ .SessionURL }}\n# its own base URL (https://<sessions host>/<id>), {{\
    \ .PublicURL }} the app's. The backend adds operatingMode\n# and the owner label.\n\
    podTemplate:\n  metadata:\n    annotations:\n      cluster-autoscaler.kubernetes.io/safe-to-evict:\
    \ \"false\"\n    labels:\n      app: browserjs-session\n  spec:\n    # A checkpoint\
    \ with postCheckpoint: stop must stay stopped until the\n    # backend removes\
    \ its pod; an automatic restart would mutate the PVC.\n    restartPolicy: Never\n\
    \    # The managed add-on's sandbox-core-policy requires gVisor; the label and\n\
    \    # taint are what GKE puts on the sessions node pool.\n    # Prefer packing\
    \ beside existing sessions, but allow a new node.\n    affinity:\n      podAffinity:\n\
    \        preferredDuringSchedulingIgnoredDuringExecution:\n          - weight:\
    \ 100\n            podAffinityTerm:\n              labelSelector:\n          \
    \      matchLabels: {app: browserjs-session}\n              topologyKey: kubernetes.io/hostname\n\
    \    runtimeClassName: gvisor\n    nodeSelector:\n      sandbox.gke.io/runtime:\
    \ gvisor\n    tolerations:\n      - key: sandbox.gke.io/runtime\n        operator:\
    \ Equal\n        value: gvisor\n        effect: NoSchedule\n    serviceAccountName:\
    \ session\n    automountServiceAccountToken: false\n    enableServiceLinks: false\n\
    \    # Chromium only saves its tabs on a clean exit: the browser's entrypoint\n\
    \    # asks it to quit and waits up to 10 s before stopping the rest.\n    terminationGracePeriodSeconds:\
    \ 30\n    securityContext:\n      # mcp-js runs as uid/gid 1000 and writes to\
    \ the session disk.\n      fsGroup: 1000\n      fsGroupChangePolicy: OnRootMismatch\n\
    \      # Nothing in a session runs as root: sandbox-hardening-policy requires\n\
    \      # it. uid 1000 is \"browser\" in the browser image and \"mcpuser\" in\n\
    \      # mcp-js; the session disk is group-writable for gid 1000 (fsGroup).\n\
    \      runAsNonRoot: true\n      runAsUser: 1000\n      runAsGroup: 1000\n   \
    \   # No seccompProfile: GKE Sandbox does not support seccomp (gVisor is\n   \
    \   # the system call filter), and the policies do not ask for one.\n    containers:\n\
    \      - name: browser\n        image: us-west1-docker.pkg.dev/browserjs-sessions/browserjs/browser@sha256:343c4582c2a6fc5491a7acb2de3b3e04c51c5df4b79bfb8edadacec173293cf7\n\
    \        env:\n          - name: SESSION_MODE\n            value: \"1\"\n    \
    \      - name: DATA_DIR\n            value: /data\n          - name: TAB_STATE_FILE\n\
    \            value: /data/chrome/browserjs-tabs.json\n        ports:\n       \
    \   - name: vnc\n            containerPort: 6080\n          - name: browser-mcp\n\
    \            containerPort: 8081\n        # Both probes are HTTP: the server is\
    \ what must answer.\n        startupProbe:\n          httpGet:\n            path:\
    \ /healthz\n            port: browser-mcp\n          periodSeconds: 1\n      \
    \    failureThreshold: 120\n        readinessProbe:\n          httpGet:\n    \
    \        path: /healthz\n            port: browser-mcp\n          periodSeconds:\
    \ 5\n          # Sessions share CPU (see resources); a slow answer under load\
    \ is\n          # not a dead browser. Not ready only after 30s without an answer.\n\
    \          timeoutSeconds: 5\n          failureThreshold: 6\n        # Three small\
    \ sessions share one 4-vCPU/16-GB node. Each requests\n        # 1 CPU and 2.5\
    \ GiB across both containers, with a 3 GiB memory limit.\n        resources:\n\
    \          requests:\n            cpu: 850m\n            memory: 2Gi\n       \
    \   limits:\n            cpu: 1500m\n            memory: 2Gi\n        # No capabilities\
    \ and no way to gain any. Chromium runs with\n        # --no-sandbox; gVisor is\
    \ the sandbox.\n        securityContext:\n          allowPrivilegeEscalation:\
    \ false\n          capabilities:\n            drop: [\"ALL\"]\n        volumeMounts:\n\
    \          - name: data\n            mountPath: /data/chrome\n            subPath:\
    \ chrome\n          - name: shm\n            mountPath: /dev/shm\n      - name:\
    \ mcp-js\n        image: us-west1-docker.pkg.dev/browserjs-sessions/browserjs/mcp-js@sha256:33f405fed26c3f0a8f6d3dbedb3c9dae8548ed17cc61fc3947ac1c92ef9b178e\n\
    \        env:\n          # One-time upload URLs are made from this (mcp-js appends\n\
    \          # /api/artifact-uploads/<token>), so they come back under the\n   \
    \       # session's own prefix.\n          - name: MCP_V8_PUBLIC_URL\n       \
    \     value: \"{{ .SessionURL }}\"\n          # Native pre hook records attempts;\
    \ existing policies authorize every call.\n          # Session policy: every tool\
    \ call and fetch request is also put to the shared OPA, at\n          # this session's\
    \ own path. Written by hack/policy-stage.sh.\n          - name: MCP_V8_POLICIES_JSON\n\
    \            value: >-\n              {\"mcp_tools\":{\"pre\":[\n            \
    \  {\"url\":\"http://policy-operator.browserjs-sessions.svc:8080\",\"policy_path\"\
    :\"browserjs/hooks/{{ .ID }}/mcp_tools/pre\"}],\n              \"mode\":\"all\"\
    ,\"policies\":[\n              {\"url\":\"file:///etc/mcp/mcp_tools.rego\"},\n\
    \              {\"url\":\"http://opa.browserjs-sessions.svc:8181\",\"policy_path\"\
    :\"browserjs/decision/{{ .ID }}/mcp_tools\"}]},\n              \"filesystem\"\
    :{\"policies\":[{\"url\":\"file:///etc/mcp/filesystem.rego\"}]},\"fetch\":{\"\
    mode\":\"all\",\"policies\":[{\"url\":\"file:///etc/mcp/fetch.rego\"},{\"url\"\
    :\"http://opa.browserjs-sessions.svc:8181\",\"policy_path\":\"browserjs/decision/{{\
    \ .ID }}/mcp_tools\"}]}}\n        ports:\n          - name: mcp\n            containerPort:\
    \ 8080\n        startupProbe:\n          httpGet:\n            path: /api/artifacts\n\
    \            port: mcp\n          periodSeconds: 1\n          failureThreshold:\
    \ 180\n        readinessProbe:\n          httpGet:\n            path: /api/artifacts\n\
    \            port: mcp\n          periodSeconds: 5\n          timeoutSeconds:\
    \ 5\n          failureThreshold: 6\n        resources:\n          requests:\n\
    \            cpu: 150m\n            memory: 512Mi\n          limits:\n       \
    \     cpu: 500m\n            memory: 1Gi\n        securityContext:\n         \
    \ allowPrivilegeEscalation: false\n          capabilities:\n            drop:\
    \ [\"ALL\"]\n        volumeMounts:\n          - name: data\n            mountPath:\
    \ /data\n    volumes:\n      - name: shm\n        emptyDir:\n          medium:\
    \ Memory\n          sizeLimit: 1Gi\nvolumeClaimTemplates:\n  - metadata:\n   \
    \   name: data\n    spec:\n      accessModes: [\"ReadWriteOnce\"]\n      storageClassName:\
    \ browserjs-session-hdd\n      resources:\n        requests:\n          storage:\
    \ 32Gi\n"
  sizes.yaml: "# The sizes a session can have besides \"small\". Small is blueprint.yaml\
    \ as it\n# is written (and the SandboxTemplate of warmpool.yaml, which is the\
    \ same):\n# 1.5 CPU and 2 GiB limit for the desktop (850m and 2 GiB requested).\
    \ A size here is that same pod with other\n# numbers, and can say nothing else:\
    \ each container's requests and limits,\n# the size of /dev/shm, and environment\
    \ variables that go with the size. The\n# backend (internal/sessions/sizes.go)\
    \ puts them into the blueprint when a\n# session of that size is made or resized\
    \ to it; deploy_test.go there holds\n# this file to the node it has to fit on\
    \ and to the billing catalogue.\n#\n# Only small is kept warm. Medium and large\
    \ start cold after idle warm\n# spares yield the resources they need (docs/session-sizes.md\
    \ has the\n# times).\n#\n# The numbers are sized for a session node of 4 vCPU\
    \ and 16 GB, which has\n# 3213m of CPU and 12097Mi left for sessions (capacity,\
    \ below).\nsizes:\n  - name: medium\n    containers:\n      browser:\n       \
    \ resources:\n          requests: {cpu: 1350m, memory: 5Gi}\n          limits:\
    \ {cpu: \"2\", memory: 5Gi}\n      mcp-js:\n        resources:\n          requests:\
    \ {cpu: 150m, memory: 512Mi}\n          limits: {cpu: 500m, memory: 1Gi}\n   \
    \     env: {MCP_V8_HEAP_MEMORY_MAX: \"16\"}\n    shm: 2Gi\n  - name: large\n \
    \   containers:\n      browser:\n        resources:\n          requests: {cpu:\
    \ 2850m, memory: 10Gi}\n          limits: {cpu: \"3\", memory: 10Gi}\n      mcp-js:\n\
    \        resources:\n          requests: {cpu: 150m, memory: 1Gi}\n          limits:\
    \ {cpu: 500m, memory: 1Gi}\n        env: {MCP_V8_HEAP_MEMORY_MAX: \"32\"}\n  \
    \  shm: 4Gi\n\n# Up to three production session nodes in us-west1-c. Conservative\
    \ room after node\n# services: three small sessions (1 CPU/2.5 GiB requested each)\
    \ fit.\ncapacity:\n  nodes: 3\n  cpu: 3213m\n  memory: 12097Mi\n"
kind: ConfigMap
metadata:
  name: session-blueprint-75gt42hf8k
  namespace: browserjs-sessions
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
---
apiVersion: v1
data:
  session-slots.py: "\"\"\"Keep one node's worth of global warm capacity across all\
    \ DaemonSet replicas.\n\nEvery replica reconciles the same global inputs and uses\
    \ resourceVersion CAS.\nDo not multiply the warm budget by the node count: spares\
    \ must not perpetuate\nnodes provisioned for claimed sessions.\n\"\"\"\nimport\
    \ json\nfrom datetime import datetime, timezone\nimport os\nimport ssl\nimport\
    \ time\nimport urllib.request\n\n\ndef quantity(value, memory=False):\n    value\
    \ = str(value)\n    suffixes = {'Gi': 1024, 'Mi': 1, 'Ki': 1 / 1024} if memory\
    \ else {'m': 1}\n    for suffix, factor in suffixes.items():\n        if value.endswith(suffix):\n\
    \            return float(value[:-len(suffix)]) * factor\n    return float(value)\
    \ / (1024 * 1024) if memory else float(value) * 1000\n\n\ndef requests(containers):\n\
    \    cpu, memory = 0, 0\n    for container in containers:\n        resources =\
    \ container.get('resources', {}).get('requests', {})\n        cpu += quantity(resources.get('cpu',\
    \ 0))\n        memory += quantity(resources.get('memory', 0), memory=True)\n \
    \   return cpu, memory\n\n\ndef desired_replicas(sandboxes, reserved=0, reservation=None,\n\
    \                     cpu=3213, memory=12097, pods=()):\n    # Do not place a\
    \ replacement beside a terminating pod on a surplus node.\n    # Its affinity\
    \ match must disappear before warm scheduling resumes.\n    if any(pod['metadata'].get('deletionTimestamp')\
    \ for pod in pods):\n        return 0\n    excluded = (reservation or {}).get(\"\
    exclude\", \"\")\n    warm, held = set(), {}\n    for item in sandboxes:\n   \
    \     name = item['metadata']['name']\n        pooled = any(ref.get('kind') ==\
    \ 'SandboxWarmPool' and ref.get('name') == 's'\n                     for ref in\
    \ item['metadata'].get('ownerReferences', []))\n        if pooled and not item['metadata'].get('deletionTimestamp'):\n\
    \            warm.add(name)\n        elif name != excluded and item.get('spec',\
    \ {}).get('operatingMode') != 'Suspended':\n            held[name] = requests(item.get('spec',\
    \ {}).get('podTemplate', {}).get('spec', {}).get('containers', []))\n    # A suspended\
    \ or removed Sandbox can still have a live pod while its\n    # controller drains\
    \ it. Keep that compute occupied until the pod is gone.\n    for pod in pods:\n\
    \        name = next((ref['name'] for ref in pod['metadata'].get('ownerReferences',\
    \ [])\n                     if ref.get('kind') == 'Sandbox'), pod['metadata']['name'])\n\
    \        if name in warm or name == excluded:\n            continue\n        actual\
    \ = requests(pod.get('spec', {}).get('containers', []))\n        desired = held.get(name,\
    \ (0, 0))\n        held[name] = tuple(max(a, b) for a, b in zip(actual, desired))\n\
    \    used_cpu = reserved * 1000 + sum(value[0] for value in held.values())\n \
    \   used_memory = reserved * 2560 + sum(value[1] for value in held.values())\n\
    \    if reservation:\n        used_cpu += reservation['cpu']\n        used_memory\
    \ += reservation['memory']\n    return max(0, min(int((cpu - used_cpu) // 1000),\n\
    \                      int((memory - used_memory) // 2560)))\n\n\ndef active_reservation(lease,\
    \ now=None):\n    spec = lease.get('spec', {})\n    if not spec.get('holderIdentity'):\n\
    \        return None\n    renewed = datetime.fromisoformat(spec['renewTime'].replace('Z',\
    \ '+00:00'))\n    now = now or datetime.now(timezone.utc)\n    if (now - renewed).total_seconds()\
    \ >= spec.get('leaseDurationSeconds', 120):\n        return None\n    ann = lease['metadata'].get('annotations',\
    \ {})\n    return {'cpu': int(ann['browserjs.dev/capacity-cpu']),\n          \
    \  'memory': int(ann['browserjs.dev/capacity-memory']),\n            'exclude':\
    \ ann.get('browserjs.dev/capacity-exclude', ''),\n            'new_slot': ann.get('browserjs.dev/capacity-new-slot')\
    \ == 'true'}\n\n\ndef main():\n    credentials = '/var/run/secrets/kubernetes.io/serviceaccount'\n\
    \    with open(credentials + '/namespace') as stream:\n        namespace = stream.read().strip()\n\
    \    context = ssl.create_default_context(cafile=credentials + '/ca.crt')\n  \
    \  root = f\"https://{os.environ['KUBERNETES_SERVICE_HOST']}:{os.environ['KUBERNETES_SERVICE_PORT_HTTPS']}\"\
    \n\n    def api(path, patch=None):\n        with open(credentials + '/token')\
    \ as stream:\n            token = stream.read().strip()\n        headers = {'Authorization':\
    \ 'Bearer ' + token}\n        data = None\n        if patch is not None:\n   \
    \         headers['Content-Type'] = 'application/merge-patch+json'\n         \
    \   data = json.dumps(patch).encode()\n        request = urllib.request.Request(root\
    \ + path, headers=headers, data=data,\n                                      \
    \   method='PATCH' if patch is not None else 'GET')\n        with urllib.request.urlopen(request,\
    \ context=context, timeout=20) as response:\n            return json.load(response)\n\
    \n    pool_path = f'/apis/extensions.agents.x-k8s.io/v1beta1/namespaces/{namespace}/sandboxwarmpools/s'\n\
    \    while True:\n        try:\n            sandboxes = api(f'/apis/agents.x-k8s.io/v1beta1/namespaces/{namespace}/sandboxes')['items']\n\
    \            pods = api(f'/api/v1/namespaces/{namespace}/pods?labelSelector=app%3Dbrowserjs-session')['items']\n\
    \            lease = api(f'/apis/coordination.k8s.io/v1/namespaces/{namespace}/leases/session-capacity')\n\
    \            wanted = desired_replicas(sandboxes, reserved=int(os.getenv('RESERVED_SLOTS',\
    \ '0')),\n                                      reservation=active_reservation(lease),\
    \ pods=pods)\n            pool = api(pool_path)\n            if pool['spec'].get('replicas')\
    \ != wanted:\n                api(pool_path, {'metadata': {'resourceVersion':\
    \ pool['metadata']['resourceVersion']},\n                                'spec':\
    \ {'replicas': wanted}})\n                print(f'Warm sessions: {wanted}', flush=True)\n\
    \        except Exception as error:\n            # Fail closed: API errors never\
    \ increase the pool. Retry from fresh state.\n            print(f'Reconcile failed:\
    \ {error}', flush=True)\n        time.sleep(2)\n\n\nif __name__ == '__main__':\n\
    \    main()\n"
