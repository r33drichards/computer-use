apiVersion: v1
data:
  catalogue.yaml: "# What is sold, what it costs to use, and what each option gives.\
    \ DATA, not\n# code: it is a ConfigMap (`billing-catalogue`) read by the backend\
    \ and the\n# billing operator and re-read when it changes, so a number here changes\
    \ with\n# a manifest apply and no image build. OpenTofu (infra/billing) makes\n\
    # Stripe's Products and Prices, and Metronome's rates, from the same file; the\
    \ UI and the public\n# site get it from GET /api/billing/catalogue. Nothing takes\
    \ an entitlement\n# from Stripe.\n#\n# Money is US dollars; `amount` is in cents\
    \ (what Stripe charges), credit and\n# rates are in micro-dollars (1 USD = 1000000).\
    \ PROPOSED numbers: the\n# arithmetic is section 7 of the design.\nversion: 1\n\
    currency: usd\n\n# One balance of credit per account, in dollars. It is used up\
    \ by:\nrates:\n  awakeMicrosPerHour: 200000     # $0.20 for each hour a small\
    \ session is awake\n  diskMicrosPerGBHour: 384       # $0.28 per GB-month (730\
    \ h): $1.40 a month for a 5 GB session, awake or asleep\nsessionDiskGB: 5\n\n\
    # The awake rate of each size of session other than small (whose rate is\n# rates.awakeMicrosPerHour).\
    \ The sizes themselves, what each gives a\n# session, are the deployment's (deploy/gke/sizes.yaml):\
    \ a size named here\n# and not there is never used, and one there and not here\
    \ is charged as\n# small. The disk is the same 5 GB at every size.\nsizes:\n \
    \ medium:\n    awakeMicrosPerHour: 400000   # $0.40: a third of a session node\n\
    \  large:\n    awakeMicrosPerHour: 800000   # $0.80: a whole session node\n\n\
    # Given once, when the first card is saved.\nsignupCredit:\n  amountMicros: 5000000\
    \          # $5.00: 25 awake hours, or less with disks kept\n  validDays: 90\n\
    \  refuseFunding: [prepaid]       # card.funding values that save the card but\
    \ earn no credit\n  refuseWallets: true            # a card saved through Apple\
    \ Pay or Google Pay earns none (its fingerprint is the device's)\n\n# Without\
    \ a subscription. Not a Stripe object. Requires a saved card, like\n# everything\
    \ else.\npayg:\n  name: Pay as you go\n  maxSessions: 3\n  maxAwake: 2\n  sizes:\
    \ [medium]                # besides small, which every plan has\n\n# Subscriptions:\
    \ a monthly price that buys more credit than it costs. One\n# Stripe Product each\
    \ (the Customer Portal can only switch between\n# Products), one monthly Price\
    \ each. The credit is granted when the period\n# is paid and expires at its end:\
    \ it does not roll over.\nplans:\n  - key: starter\n    name: Starter\n    productId:\
    \ cu_plan_starter\n    lookupKey: cu_starter_monthly_v1\n    amount: 500     \
    \             # $5 a month\n    creditMicros: 10000000       # $10 of credit:\
    \ about 40 awake hours with one session kept\n    maxSessions: 3\n    maxAwake:\
    \ 2\n    sizes: [medium]\n    enabled: true\n  - key: pro\n    name: Pro\n   \
    \ productId: cu_plan_pro\n    lookupKey: cu_pro_monthly_v1\n    amount: 2000 \
    \                # $20 a month\n    creditMicros: 44000000       # $44: about\
    \ 200 awake hours with three sessions kept\n    maxSessions: 10\n    maxAwake:\
    \ 4\n    sizes: [medium, large]\n    enabled: true\n  - key: scale\n    name:\
    \ Scale\n    productId: cu_plan_scale\n    lookupKey: cu_scale_monthly_v1\n  \
    \  amount: 10000                # $100 a month\n    creditMicros: 240000000  \
    \    # $240: about 1100 awake hours with ten sessions kept\n    maxSessions: 25\n\
    \    maxAwake: 8\n    sizes: [medium, large]\n    # Not sold until the project's\
    \ CPU quota is raised: eight awake sessions\n    # of one account would be most\
    \ of today's eleven places.\n    enabled: false\n\n# Credit packs: one-off payments,\
    \ a dollar of credit for a dollar. They are\n# \"pay as you go\", the subscriber's\
    \ \"top-up\", and what auto-recharge buys:\n# one mechanism. Valid 12 months.\n\
    packs:\n  - key: credit-5\n    name: $5 of credit\n    productId: cu_credit\n\
    \    lookupKey: cu_credit_5_v1\n    amount: 500\n    creditMicros: 5000000\n \
    \   validDays: 365\n    enabled: true\n  - key: credit-20\n    name: $20 of credit\n\
    \    productId: cu_credit\n    lookupKey: cu_credit_20_v1\n    amount: 2000\n\
    \    creditMicros: 20000000\n    validDays: 365\n    enabled: true\n  - key: credit-50\n\
    \    name: $50 of credit\n    productId: cu_credit\n    lookupKey: cu_credit_50_v1\n\
    \    amount: 5000\n    creditMicros: 50000000\n    validDays: 365\n    enabled:\
    \ true\n\n# Optional, off for every account until its owner turns it on.\nautoRecharge:\n\
    \  defaultThresholdMicros: 2000000   # recharge when the balance falls below $2\n\
    \  defaultPack: credit-20\n  defaultMonthlyCapCents: 5000      # at most $50 of\
    \ automatic charges a calendar month\n  maxMonthlyCapCents: 50000\n"
kind: ConfigMap
metadata:
  name: billing-catalogue
  namespace: browserjs-sessions
  annotations:
    argocd.argoproj.io/sync-wave: '0'
