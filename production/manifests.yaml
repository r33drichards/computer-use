            metadata:
              labels:
                app: release-canary
            spec:
              automountServiceAccountToken: false
              containers:
              - command:
                - python3
                - -c
                - "import sys, time, urllib.request\nbase = \"http://site-canary.browserjs-sessions.svc\"\
                  \nfor attempt in range(20):\n    time.sleep(0.5)\n    for path,\
                  \ want in ((\"/\", b\"<html\"), (\"/healthz\", b\"\")):\n      \
                  \  with urllib.request.urlopen(base + path, timeout=10) as r:\n\
                  \            body = r.read()\n            if r.status != 200 or\
                  \ want not in body.lower():\n                sys.exit(\"%s answered\
                  \ %d, %d bytes, without %r\" % (path, r.status, len(body), want))\n\
                  print(\"the new site answered / and /healthz twenty times\")\n"
                image: python:3.13-alpine@sha256:2dd78ad5cf13a0b68f5134dc49aa9950203a8cf4b7463431b9f3b398287c5059
