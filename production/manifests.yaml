data:
  config.yaml: "address: :8443\nhealth_check_addr: 0.0.0.0:28080\ncertificate_file:\
    \ /tls/tls.crt\ncertificate_key_file: /tls/tls.key\nauthenticate_service_url:\
    \ https://authenticate.computeruse.site\nidp_provider: oidc\nidp_provider_url:\
    \ https://dex.computeruse.site/dex\nidp_client_id: pomerium\ndatabroker_storage_type:\
    \ file\ndatabroker_storage_connection_string: file:///data/databroker\nruntime_flags:\n\
    \  mcp_dynamic_client_registration: true\nmcp_allowed_client_id_domains:\n- claude.ai\n\
    - chatgpt.com\ntimeout_read: 5m\nroutes:\n- name: session-upload\n  from: https://sessions.computeruse.site\n\
    \  regex: ^/s-[a-z0-9]+/api/artifact-uploads/[0-9a-f]+$\n  to: http://backend\n\
    \  allow_public_unauthenticated_access: true\n  preserve_host_header: true\n \
    \ timeout: 5m\n- name: session-vnc\n  from: https://sessions.computeruse.site\n\
    \  regex: ^/s-[a-z0-9]+/vnc$\n  to: http://backend\n  allow_public_unauthenticated_access:\
    \ true\n  allow_websockets: true\n  preserve_host_header: true\n- name: session-mcp\n\
    \  from: https://sessions.computeruse.site\n  regex: ^/s-[a-z0-9]+/mcp(/.*)?$\n\
    \  to: http://backend\n  mcp:\n    server:\n      max_request_bytes: 1048576\n\
    \  policy: &id001\n  - allow:\n      and:\n      - authenticated_user: true\n\
    \  pass_identity_headers: true\n  preserve_host_header: true\n- name: legacy-session-upload\n\
    \  from: https://*.sessions.computeruse.site\n  prefix: /api/artifact-uploads/\n\
    \  to: http://backend\n  allow_public_unauthenticated_access: true\n  preserve_host_header:\
    \ true\n  timeout: 5m\n- name: legacy-session-vnc\n  from: https://*.sessions.computeruse.site\n\
    \  path: /vnc\n  to: http://backend\n  allow_public_unauthenticated_access: true\n\
    \  allow_websockets: true\n  preserve_host_header: true\n- name: legacy-session-oauth-metadata\n\
    \  from: https://*.sessions.computeruse.site\n  prefix: /.well-known/oauth-\n\
    \  to: http://backend\n  allow_public_unauthenticated_access: true\n  preserve_host_header:\
    \ true\n- name: legacy-session-mcp\n  from: https://*.sessions.computeruse.site\n\
    \  prefix: /mcp\n  to: http://backend\n  mcp:\n    server:\n      max_request_bytes:\
    \ 1048576\n  policy: *id001\n  pass_identity_headers: true\n  preserve_host_header:\
    \ true\n- name: dex\n  from: https://dex.computeruse.site\n  to: http://dex:5556\n\
    \  allow_public_unauthenticated_access: true\n  preserve_host_header: true\n-\
    \ name: app\n  from: https://app.computeruse.site\n  to: http://backend\n  policy:\
    \ *id001\n  pass_identity_headers: true\n  preserve_host_header: true\n  timeout:\
    \ 5m\n- name: api\n  from: https://api.computeruse.site\n  prefix: /v1/\n  to:\
    \ http://backend\n  allow_public_unauthenticated_access: true\n  preserve_host_header:\
    \ true\n- name: api-token\n  from: https://api.computeruse.site\n  path: /oauth/token\n\
    \  to: http://backend\n  allow_public_unauthenticated_access: true\n  preserve_host_header:\
    \ true\n- name: api-mcp\n  from: https://api.computeruse.site\n  regex: ^/s-[a-z0-9]+/mcp(/.*)?$\n\
