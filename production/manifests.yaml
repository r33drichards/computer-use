apiVersion: v1
data:
  opa-config.yaml: "# Configuration of the shared OPA (opa run --server -c this).\
    \ Verified with\n# OPA 1.9.0; see ../../plans/2026-10-02-session-policies-design.md,\
    \ section 11.\nservices:\n  operator:\n    url: http://policy-operator.browserjs-sessions.svc:8080\n\
    \    credentials:\n      bearer:\n        token: \"${BUNDLE_TOKEN}\"\nbundles:\n\
    \  browserjs:\n    service: operator\n    resource: /bundles/browserjs.tar.gz\n\
    \    persist: true\n    polling:\n      # Long polling: the operator holds the\
    \ request until the bundle changes,\n      # so a change is fetched at once. The\
    \ delays apply between requests and\n      # when the operator does not long-poll.\n\
    \      long_polling_timeout_seconds: 30\n      min_delay_seconds: 1\n      max_delay_seconds:\
    \ 2\npersistence_directory: /var/opa\n# Tool attempts are durably recorded by\
    \ MCPJS native pre hooks.\n# Do not enable asynchronous decision logs as the source\
    \ of webhook events.\n"
  system-authz.rego: "package system.authz\n\nimport rego.v1\n\ndefault allow := false\n\
    \n# A session's mcp-js asking for a decision. It cannot send an identity.\nallow\
    \ if {\n\tinput.method == \"POST\"\n\tcount(input.path) == 6\n\tarray.slice(input.path,\
    \ 0, 4) == [\"v1\", \"data\", \"browserjs\", \"decision\"]\n\t# No ?explain, ?instrument,\
    \ ?provenance, ?metrics: they describe the policy.\n\tobject.keys(input.params)\
    \ == set()\n}\n\n# Kubelet probes.\nallow if {\n\tinput.method == \"GET\"\n\t\
    input.path == [\"health\"]\n}\n\n# The operator, reading what this replica has\
    \ loaded.\nallow if {\n\tinput.identity == opa.runtime().env.OPERATOR_TOKEN\n\t\
    input.identity != \"\"\n\tinput.method == \"GET\"\n\tinput.path == [\"v1\", \"\
    data\", \"browserjs\", \"loaded\"]\n}\n"
kind: ConfigMap
metadata:
  name: opa-config-4fmcg98kmg
  namespace: browserjs-sessions
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
