apiVersion: v1
data:
  blueprint.yaml: "# deploy/base/blueprint.yaml for GKE: gVisor nodes, the session\n\
    # ServiceAccount, the images from the registry, and what Agent Sandbox's\n# admission\
    \ policies ask for. Keep the rest in step with base.\n#\n# The two image lines\
    \ are written by hack/pin-images.sh from the images:\n# block of kustomization.yaml;\
    \ do not edit them here.\n#\n# The spec of a session's Sandbox (agents.x-k8s.io/v1beta1),\
    \ rendered by the\n# backend for each new session: {{ .ID }} is the session's\
    \ ID, {{ .SessionURL }}\n# its own base URL (https://<sessions host>/<id>), {{\
    \ .PublicURL }} the app's. The backend adds operatingMode\n# and the owner label.\n\
    podTemplate:\n  metadata:\n    labels:\n      app: browserjs-session\n  spec:\n\
    \    # The managed add-on's sandbox-core-policy requires gVisor; the label and\n\
    \    # taint are what GKE puts on the sessions node pool.\n    runtimeClassName:\
    \ gvisor\n    nodeSelector:\n      sandbox.gke.io/runtime: gvisor\n    tolerations:\n\
    \      - key: sandbox.gke.io/runtime\n        operator: Equal\n        value:\
    \ gvisor\n        effect: NoSchedule\n    serviceAccountName: session\n    automountServiceAccountToken:\
    \ false\n    enableServiceLinks: false\n    # Chromium only saves its tabs on\
    \ a clean exit: the browser's entrypoint\n    # asks it to quit and waits up to\
    \ 10 s before stopping the rest.\n    terminationGracePeriodSeconds: 30\n    securityContext:\n\
    \      # mcp-js runs as uid/gid 1000 and writes to the session disk.\n      fsGroup:\
    \ 1000\n      fsGroupChangePolicy: OnRootMismatch\n      # Nothing in a session\
    \ runs as root: sandbox-hardening-policy requires\n      # it. uid 1000 is \"\
    browser\" in the browser image and \"mcpuser\" in\n      # mcp-js; the session\
    \ disk is group-writable for gid 1000 (fsGroup).\n      runAsNonRoot: true\n \
