apiVersion: batch/v1
kind: CronJob
metadata:
  name: billing-export
  namespace: browserjs-sessions
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: billing-export
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: billing-export
        spec:
          containers:
          - command:
            - bash
            - -euo
            - pipefail
            - -c
            - "command -v kubectl curl jq >/dev/null\nout=/tmp/export.yaml\nkubectl\
              \ -n \"$NAMESPACE\" get accounts.browserjs.dev -o yaml >\"$out\"\nif\
              \ [ -z \"$BUCKET\" ]; then\n  cat \"$out\"\n  exit 0\nfi\nname=\"export/$(date\
              \ -u +%Y/%m/%Y-%m-%dT%H-%M-%SZ).yaml\"\n# The token is this ServiceAccount's\
              \ own, from the node's\n# metadata server. It goes to curl on stdin:\
              \ never in a\n# command line, a file or this log.\ncurl -sS --fail -H\
              \ 'Metadata-Flavor: Google' \\\n  'http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token'\
              \ |\n  jq -r '\"header = \\\"Authorization: Bearer \\(.access_token)\\\
              \"\"' |\n  curl -sS --fail -K - -o /dev/null -X POST \\\n    -H 'Content-Type:\
              \ application/yaml' --data-binary \"@$out\" \\\n    \"https://storage.googleapis.com/upload/storage/v1/b/$BUCKET/o?uploadType=media&name=$(printf\
              \ %s \"$name\" | jq -sRr @uri)\"\necho \"exported $(wc -c <\"$out\"\
              ) bytes to gs://$BUCKET/$name\"\n"
            env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BUCKET
              value: browserjs-sessions-billing-export
            - name: HOME
              value: /tmp
            image: alpine/k8s:1.36.5@sha256:094adf64cdc4827377cdbe7ea5747472ce115f9fbc64a4e35970ec66777f9a00
            name: export
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /tmp
              name: tmp
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: billing-export
          volumes:
          - emptyDir: {}
            name: tmp
  schedule: 17 3 * * *
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  suspend: true
